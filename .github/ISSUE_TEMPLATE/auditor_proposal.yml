name: Auditor / scenario proposal
description: Propose a new specialized auditor, invariant, scenario pack, or reference module
title: "[Proposal]: "
labels: ["proposal"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Proposal type
      options:
        - Auditor
        - Invariant
        - Scenario pack
        - Technical reference
        - Benchmark case
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: Engineering gap
      description: What failure mode or verification gap is not adequately covered today?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Define what the module should inspect or validate and what is explicitly out of scope.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or motivating cases
      description: Link official MQL5 semantics, reproducible defects, broker constraints, or benchmark cases when available.
  - type: textarea
    id: interaction
    attributes:
      label: Interaction with existing modules
      description: Explain overlap, dependencies, stable IDs, and why this should not be folded into an existing module.
    validations:
      required: true
