name: Release Skill

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          SKILL_VERSION="$(awk '/^[[:space:]]*version:[[:space:]]*/ {gsub(/["[:space:]]/, "", $2); print $2; exit}' mql5-engineering/SKILL.md)"
          ROOT_VERSION="$(tr -d '[:space:]' < VERSION)"
          BANNER_VERSION="$(sed -n 's/^VERSION="\([^"]*\)"/\1/p' mql5-engineering/scripts/banner.sh | head -1)"
          INSTALLER_VERSION="$(sed -n 's/^INSTALLER_VERSION="\([^"]*\)"/\1/p' install.sh | head -1)"
          test "$TAG" = "$SKILL_VERSION"
          test "$TAG" = "$ROOT_VERSION"
          test "$TAG" = "$BANNER_VERSION"
          test "$TAG" = "$INSTALLER_VERSION"

      - name: Validate required v3.1 structure
        shell: bash
        run: |
          set -euo pipefail
          test -f mql5-engineering/workflows/release.md
          test -f mql5-engineering/auditors/risk.md
          test -f mql5-engineering/auditors/trade-execution.md
          test -f mql5-engineering/auditors/state.md
          test -f mql5-engineering/auditors/mql5-market.md
          test -f mql5-engineering/auditors/economic-calendar.md
          test -f mql5-engineering/auditors/time-session.md
          test -f mql5-engineering/invariants/execution.md
          test -f mql5-engineering/invariants/financial-risk.md
          test -f mql5-engineering/scenarios/market-validation.md
          test -f mql5-engineering/references/broker-compatibility.md
          test -f mql5-engineering/references/time-semantics.md
          test -f mql5-engineering/engineering/evidence.md
          test -f mql5-engineering/references/error-handling.md
          test -f mql5-engineering/templates/release-report.md

      - name: Validate scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n uninstall.sh
          find mql5-engineering/scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          python3 -m py_compile mql5-engineering/scripts/verify-risk-formula.py
          python3 -m py_compile mql5-engineering/scripts/verify-volume-normalization.py

      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          ZIP="mql5-engineering-${TAG}.zip"
          zip -qr "$ZIP" mql5-engineering
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "MQL5 Engineering $GITHUB_REF_NAME" \
            --generate-notes
