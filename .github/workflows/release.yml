name: Release Skill

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          SKILL_VERSION="$(awk '/^[[:space:]]*version:[[:space:]]*/ {gsub(/["[:space:]]/, "", $2); print $2; exit}' mql5-engineering/SKILL.md)"
          ROOT_VERSION="$(tr -d '[:space:]' < VERSION)"
          BANNER_VERSION="$(sed -n 's/^VERSION="\([^"]*\)"/\1/p' mql5-engineering/scripts/banner.sh | head -1)"
          test "$TAG" = "$SKILL_VERSION"
          test "$TAG" = "$ROOT_VERSION"
          test "$TAG" = "$BANNER_VERSION"

      - name: Validate required v3 structure
        shell: bash
        run: |
          set -euo pipefail
          test -f mql5-engineering/workflows/review.md
          test -f mql5-engineering/auditors/code.md
          test -f mql5-engineering/auditors/risk.md
          test -f mql5-engineering/auditors/spec-compliance.md
          test -f mql5-engineering/engineering/codebase-design.md
          test -f mql5-engineering/engineering/evidence.md

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n uninstall.sh
          find mql5-engineering/scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          ZIP="mql5-engineering-${TAG}.zip"
          zip -qr "$ZIP" mql5-engineering
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "MQL5 Engineering $GITHUB_REF_NAME" \
            --generate-notes
