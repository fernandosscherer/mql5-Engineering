<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">MQL5 Engineering</title>
<desc id="desc">Dark blue isometric line-art banner for MQL5 Engineering showing code, charts, trading workstation and workflow.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06162d"/>
    <stop offset="1" stop-color="#0a2342"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6ee7ff"/>
    <stop offset="1" stop-color="#2dd4bf"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#12365d" stroke-width="1"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#grid)" opacity=".38"/>
<g fill="none" stroke="#1685d8" stroke-width="2" opacity=".8">
  <path d="M0 660L420 420M80 760L520 500M1090 120L1590 410M1180 40L1590 280"/>
  <path d="M990 870L1590 525M1020 900L1590 570"/>
</g>

<!-- left title block -->
<g font-family="Inter,Arial,sans-serif">
  <text x="70" y="255" font-size="118" font-weight="800" fill="#eef8ff" letter-spacing="4">MQL<tspan fill="#39e3b5">5</tspan></text>
  <text x="70" y="365" font-size="72" font-weight="300" fill="#d7ecff" letter-spacing="7">ENGINEERING</text>
  <text x="72" y="425" font-size="26" fill="#72bfff" letter-spacing="9">BUILD • IMPROVE • DEBUG • AUDIT</text>
</g>

<!-- workflow -->
<g font-family="Inter,Arial,sans-serif" font-size="24" fill="#9ad8ff" stroke="#28a6ff" stroke-width="2">
  <g transform="translate(72 490)">
    <rect x="0" y="0" width="92" height="60" rx="10" fill="#071e38"/><path d="M30 18h20v24H30zM35 12h10" />
    <text x="0" y="92" stroke="none" fill="#9ad8ff">Plan</text>
  </g>
  <g transform="translate(196 490)">
    <path d="M0 30h48m-10-9 10 9-10 9" />
    <rect x="72" y="0" width="92" height="60" rx="10" fill="#071e38"/><circle cx="118" cy="30" r="17"/><path d="m108 30 7 7 14-17"/>
    <text x="73" y="92" stroke="none" fill="#9ad8ff">Approve</text>
  </g>
  <g transform="translate(382 490)">
    <path d="M0 30h48m-10-9 10 9-10 9" />
    <rect x="72" y="0" width="92" height="60" rx="10" fill="#071e38"/><circle cx="118" cy="30" r="17"/><path d="M118 15v30M103 30h30"/>
    <text x="72" y="92" stroke="none" fill="#9ad8ff">Execute</text>
  </g>
  <g transform="translate(568 490)">
    <path d="M0 30h48m-10-9 10 9-10 9" />
    <rect x="72" y="0" width="92" height="60" rx="10" fill="#071e38"/><path d="M96 42h45M100 38l12-15 10 8 14-16"/>
    <text x="72" y="92" stroke="none" fill="#9ad8ff">Validate</text>
  </g>
</g>

<!-- author -->
<g font-family="Inter,Arial,sans-serif" font-size="20" fill="#91c9ef">
  <text x="72" y="690">Author: Fernando Scherer</text>
  <text x="72" y="725">GitHub: github.com/fernandosscherer/mql5-Engineering</text>
</g>
<text x="72" y="815" font-family="monospace" font-size="18" fill="#4ba2df" letter-spacing="5">CLEAN CODE • BETTER SYSTEMS • STRONGER TRADERS</text>

<!-- isometric desk -->
<g stroke="#1d97f0" stroke-width="3" fill="#071b33">
  <polygon points="690,610 1240,610 1460,735 910,735"/>
  <polygon points="910,735 1460,735 1460,780 910,780" fill="#06172a"/>
  <polygon points="690,610 910,735 910,780 690,655" fill="#08213d"/>
</g>

<!-- monitors -->
<g stroke="#2faeff" stroke-width="3" fill="#06182d">
  <polygon points="720,250 1015,205 1015,505 720,550"/>
  <polygon points="1040,245 1315,285 1315,545 1040,505"/>
  <polygon points="1335,330 1510,380 1510,610 1335,560"/>
</g>

<!-- code -->
<g font-family="monospace" font-size="18">
  <text x="750" y="295" fill="#7de7ff">#property strict</text>
  <text x="750" y="328" fill="#b68cff">input double Lots = 0.10;</text>
  <text x="750" y="361" fill="#8cf7b7">int OnInit()</text>
  <text x="750" y="394" fill="#d8f2ff">{</text>
  <text x="775" y="427" fill="#7de7ff">Print("MQL5 Engineering");</text>
  <text x="775" y="460" fill="#b68cff">return(INIT_SUCCEEDED);</text>
  <text x="750" y="493" fill="#d8f2ff">}</text>
</g>

<!-- chart -->
<g transform="translate(1065 300)">
  <g stroke="#163d67" stroke-width="1"><path d="M0 0v190M50 0v190M100 0v190M150 0v190M200 0v190M0 40h220M0 80h220M0 120h220M0 160h220"/></g>
  <polyline points="0,165 22,150 40,156 58,130 74,138 92,108 112,115 132,82 150,92 168,60 185,68 205,37 220,44" fill="none" stroke="#37e6bc" stroke-width="4" filter="url(#glow)"/>
  <g stroke="#40d6ff" fill="#0b3854">
    <path d="M25 135v-34M17 112h16v16H17z"/><path d="M62 120V84M54 95h16v18H54z"/><path d="M100 96V61M92 68h16v20H92z"/><path d="M140 80V44M132 54h16v18h-16z"/><path d="M182 58V22M174 32h16v18h-16z"/>
  </g>
  <text x="0" y="220" font-family="monospace" font-size="18" fill="#82d7ff">EURUSD, H1</text>
</g>

<!-- side menu -->
<g font-family="monospace" font-size="18" fill="#6cbef0">
  <text x="1360" y="395">IDEAS</text><text x="1360" y="428">BACKTEST</text><text x="1360" y="461">OPTIMIZE</text><text x="1360" y="494">DEPLOY</text><text x="1360" y="527">MONITOR</text>
</g>

<!-- books -->
<g stroke="#2a9df4" fill="#07213c" stroke-width="2">
  <polygon points="660,550 825,550 850,565 685,565"/><polygon points="670,575 835,575 860,590 695,590"/><polygon points="680,600 845,600 870,615 705,615"/>
</g>
<g font-family="monospace" font-size="13" fill="#8bd7ff">
  <text x="700" y="562">MQL5 REFERENCE</text><text x="710" y="587">TRADING SYSTEMS</text><text x="720" y="612">RISK MANAGEMENT</text>
</g>

<!-- bull wireframe -->
<g transform="translate(1120 115)" fill="none" stroke="#35c8ff" stroke-width="2">
  <path d="M0 70 35 35l45 8 28-25 44 22 16 43-35 28-48-5-30 20-42-18z"/>
  <path d="M35 35 55 70 0 70M80 43 55 70l30 36M108 18 100 74l68 9M55 70l45 4 33 37M13 108l42-38 78 41"/>
  <path d="M108 18 120 0l8 23M80 43 70 16 14 12"/>
</g>

<!-- wall label -->
<g stroke="#2da8ff" fill="#071d35" stroke-width="2">
  <rect x="1180" y="95" width="225" height="105" rx="4"/>
</g>
<text x="1205" y="130" font-family="monospace" font-size="18" fill="#6ac7ff" letter-spacing="4">DISCIPLINE</text>
<text x="1205" y="160" font-family="monospace" font-size="18" fill="#6ac7ff" letter-spacing="4">BUILDS FREEDOM</text>

<!-- city -->
<g stroke="#218ad0" fill="none" stroke-width="2" opacity=".75">
  <path d="M1450 260v-115h45v115M1500 260v-70h40v70M1410 260v-50h34v50"/>
  <path d="M1472 145v-35M1462 110h20"/>
</g>

<!-- footer accent -->
<rect x="0" y="870" width="1600" height="2" fill="url(#accent)" opacity=".8"/>
</svg>